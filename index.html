<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TDT Online">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192.png?text=TDT">
  
  <title>TDT Online v3.4</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #007aff;
      --text: #ffffff;
      --border: #2a2a2a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 15px;
      padding-top: env(safe-area-inset-top, 15px);
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .settings-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 5px;
    }
    .version-badge {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      color: #888;
    }

    .controls-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .mode-toggle {
      display: flex;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .mode-btn {
      background: transparent;
      color: var(--text);
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    .mode-btn.active {
      background: var(--accent);
    }
    .category-select {
      flex-grow: 1;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
      min-width: 150px;
    }

    .player-container {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
    }
    .channel-card {
      position: relative;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 15px 8px 10px;
      text-align: center;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.1s, border-color 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .channel-card:active {
      transform: scale(0.96);
    }
    .channel-card img {
      max-width: 60px;
      max-height: 40px;
      object-fit: contain;
      margin-bottom: 8px;
    }
    .channel-card span {
      display: block;
      font-size: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    
    .fav-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.5);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      color: white;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>TDT Online</h1>
      <div class="header-actions">
        <span class="version-badge">v3.4.0</span>
        <button class="settings-btn" onclick="forceRefresh()" title="Forzar actualización de listas">🔄</button>
      </div>
    </div>

    <div class="player-container">
      <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <div class="controls-bar">
      <div class="mode-toggle">
        <button id="btnTV" class="mode-btn active" onclick="switchMode('tv')">TV</button>
        <button id="btnRadio" class="mode-btn" onclick="switchMode('radio')">Radio</button>
      </div>
      
      <select id="categorySelect" class="category-select" onchange="filterChannels()">
        <option value="Favoritos">⭐ Favoritos</option>
        <option value="Todos">Todos</option>
      </select>
    </div>

    <div class="grid" id="channelsGrid">
      <div class="status-msg" id="loadingMsg">Cargando canales desde tu repositorio...</div>
    </div>
  </div>

  <script>
    let currentMode = 'tv'; 
    let dataTV = [];
    let dataRadio = [];
    let favorites = JSON.parse(localStorage.getItem('tdtFavorites')) || [];
    
    const video = document.getElementById('videoPlayer');
    let hls = null;

    async function loadApp() {
      const cachedTV = localStorage.getItem('tdtTV');
      const cachedRadio = localStorage.getItem('tdtRadio');

      if (cachedTV && cachedRadio) {
        dataTV = extractChannels(JSON.parse(cachedTV));
        dataRadio = extractChannels(JSON.parse(cachedRadio));
        switchMode(currentMode);
        updateDataBackground();
        return;
      }

      try {
        document.getElementById('loadingMsg').textContent = "Cargando listas desde GitHub...";
        
        // Petición directa a tus archivos alojados en GitHub Pages
        const [resTV, resRadio] = await Promise.all([
          fetch('./tv.json'),
          fetch('./radio.json').catch(() => ({ ok: false })) // Radio opcional por si no la subes
        ]);

        if (!resTV.ok) throw new Error("No se pudo cargar tv.json desde tu repositorio");
        
        const jsonTV = await resTV.json();
        localStorage.setItem('tdtTV', JSON.stringify(jsonTV));
        dataTV = extractChannels(jsonTV);

        if (resRadio && resRadio.ok) {
          const jsonRadio = await resRadio.json();
          localStorage.setItem('tdtRadio', JSON.stringify(jsonRadio));
          dataRadio = extractChannels(jsonRadio);
        }

        switchMode(currentMode);
      } catch (err) {
        document.getElementById('channelsGrid').innerHTML = `<div class="status-msg" style="color:#ff4444;">Error: Asegúrate de haber subido el archivo <b>tv.json</b> a tu repositorio de GitHub. (${err.message})</div>`;
        console.error(err);
      }
    }

    async function updateDataBackground() {
      try {
        const [resTV, resRadio] = await Promise.all([
          fetch('./tv.json'),
          fetch('./radio.json').catch(() => ({ ok: false }))
        ]);
        if (resTV.ok) {
          const jsonTV = await resTV.json();
          localStorage.setItem('tdtTV', JSON.stringify(jsonTV));
          dataTV = extractChannels(jsonTV);
        }
        if (resRadio && resRadio.ok) {
          const jsonRadio = await resRadio.json();
          localStorage.setItem('tdtRadio', JSON.stringify(jsonRadio));
          dataRadio = extractChannels(jsonRadio);
        }
      } catch (e) {
        // Silencioso si falla la red de fondo
      }
    }

    function forceRefresh() {
      if (confirm("¿Quieres actualizar las listas descargándolas de nuevo?")) {
        localStorage.removeItem('tdtTV');
        localStorage.removeItem('tdtRadio');
        location.reload();
      }
    }

    function extractChannels(data) {
      const spainData = data.countries.find(c => c.name.toLowerCase() === "españa" || c.name.toLowerCase() === "spain") || data.countries[0];
      if (!spainData || !spainData.ambits) return [];

      let parsedList = [];
      spainData.ambits.forEach(ambitObj => {
        if (ambitObj.channels) {
          ambitObj.channels.forEach(ch => {
            if (ch.options && ch.options.length > 0) {
              parsedList.push({
                name: ch.name,
                logo: ch.logo,
                url: ch.options[0].url,
                category: ambitObj.name || ambitObj.ambit 
              });
            }
          });
        }
      });
      return parsedList;
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btnTV').classList.toggle('active', mode === 'tv');
      document.getElementById('btnRadio').classList.toggle('active', mode === 'radio');
      
      const currentData = mode === 'tv' ? dataTV : dataRadio;
      
      if (currentData.length === 0) {
        document.getElementById('channelsGrid').innerHTML = `<div class="status-msg">No hay datos de ${mode.toUpperCase()} disponibles. Sube el archivo correspondiente a GitHub.</div>`;
        document.getElementById('categorySelect').innerHTML = '<option value="Favoritos">⭐ Favoritos</option>';
        return;
      }

      const select = document.getElementById('categorySelect');
      const uniqueCategories = [...new Set(currentData.map(ch => ch.category))];
      
      select.innerHTML = '<option value="Favoritos">⭐ Favoritos</option><option value="Todos">Todos</option>';
      uniqueCategories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);
      });

      if (select.value !== 'Favoritos' && uniqueCategories.includes('Generalistas')) {
        select.value = 'Generalistas';
      } else {
        select.value = 'Favoritos';
      }
      
      filterChannels();
    }

    function filterChannels() {
      const select = document.getElementById('categorySelect');
      const category = select.value;
      const currentData = currentMode === 'tv' ? dataTV : dataRadio;
      let filtered = [];

      if (category === 'Favoritos') {
        filtered = currentData.filter(ch => favorites.includes(ch.name));
      } else if (category === 'Todos') {
        filtered = currentData;
      } else {
        filtered = currentData.filter(ch => ch.category === category);
      }

      renderChannels(filtered, category);
    }

    function renderChannels(channels, currentCategory) {
      const grid = document.getElementById('channelsGrid');
      grid.innerHTML = '';

      if (channels.length === 0) {
        const msg = currentCategory === 'Favoritos' 
          ? 'No tienes canales favoritos guardados.' 
          : 'No hay canales en esta categoría.';
        grid.innerHTML = `<div class="status-msg">${msg}</div>`;
        return;
      }
      
      channels.forEach(ch => {
        const isFav = favorites.includes(ch.name);
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.onclick = () => playStream(ch.url);
        
        card.innerHTML = `
          <button class="fav-btn" onclick="toggleFav('${ch.name}', event)">
            ${isFav ? '❤️' : '🤍'}
          </button>
          <img src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/70x45?text=MEDIA'">
          <span>${ch.name}</span>
        `;
        grid.appendChild(card);
      });
    }

    function toggleFav(channelName, event) {
      event.stopPropagation(); 
      
      if (favorites.includes(channelName)) {
        favorites = favorites.filter(name => name !== channelName);
      } else {
        favorites.push(channelName);
      }
      
      localStorage.setItem('tdtFavorites', JSON.stringify(favorites));
      filterChannels();
    }

    function playStream(url) {
      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(() => {});
      }
    }

    loadApp();
  </script>
</body>
</html>
