<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TDT Online">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192.png?text=TDT">
  
  <title>TDT Online v3.1</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #007aff;
      --text: #ffffff;
      --border: #2a2a2a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 15px;
      padding-top: env(safe-area-inset-top, 15px);
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .settings-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 5px;
    }
    .version-badge {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      color: #888;
    }

    .controls-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .mode-toggle {
      display: flex;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .mode-btn {
      background: transparent;
      color: var(--text);
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    .mode-btn.active {
      background: var(--accent);
    }
    .category-select {
      flex-grow: 1;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
      min-width: 150px;
    }

    .player-container {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
    }
    .channel-card {
      position: relative;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 15px 8px 10px;
      text-align: center;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.1s, border-color 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .channel-card:active {
      transform: scale(0.96);
    }
    .channel-card img {
      max-width: 60px;
      max-height: 40px;
      object-fit: contain;
      margin-bottom: 8px;
    }
    .channel-card span {
      display: block;
      font-size: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    
    .fav-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.5);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      color: white;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #aaa;
    }

    #setupModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 15px;
      max-width: 600px;
      width: 100%;
      border: 1px solid var(--border);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content h2 { margin-top: 0; font-size: 1.3rem; }
    .modal-content a { color: var(--accent); font-weight: bold; }
    textarea {
      width: 100%;
      height: 90px;
      background: #000;
      color: #0f0;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-family: monospace;
      margin: 8px 0 15px;
      resize: vertical;
      font-size: 0.8rem;
    }
    .save-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      font-weight: bold;
    }
    .error-msg {
      color: #ff4444;
      margin-bottom: 15px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>

  <div id="setupModal">
    <div class="modal-content">
      <h2>Configuración de Base de Datos</h2>
      <p style="font-size: 0.9rem; color: #ccc;">Abre los enlaces, pulsa "Seleccionar todo" (Cmd/Ctrl + A), copia y pega abajo.</p>
      
      <div id="jsonError" class="error-msg">Error: Revisa que ambos textos sean JSON válidos.</div>
      
      <!-- Enlaces corregidos directamente al RAW de GitHub -->
      <label style="font-size: 0.9rem;">1. Copia el texto crudo de <a href="https://raw.githubusercontent.com/LaQuay/TDTChannels/master/tv.json" target="_blank">TV.json</a> aquí:</label>
      <textarea id="jsonInputTV" placeholder='Pega el contenido de la Televisión...'></textarea>
      
      <label style="font-size: 0.9rem;">2. Copia el texto crudo de <a href="https://raw.githubusercontent.com/LaQuay/TDTChannels/master/radio.json" target="_blank">RADIO.json</a> aquí (Opcional):</label>
      <textarea id="jsonInputRadio" placeholder='Pega el contenido de la Radio...'></textarea>
      
      <button class="save-btn" onclick="saveJSONData()">Guardar y Cargar</button>
      <button class="save-btn" onclick="closeSetup()" style="background: transparent; border: 1px solid #333; margin-top: 10px;" id="cancelBtn">Cancelar</button>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <h1>TDT Online</h1>
      <div class="header-actions">
        <span class="version-badge">v3.1.0</span>
        <button class="settings-btn" onclick="openSetup()" title="Actualizar listas">⚙️</button>
      </div>
    </div>

    <div class="player-container">
      <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <div class="controls-bar">
      <div class="mode-toggle">
        <button id="btnTV" class="mode-btn active" onclick="switchMode('tv')">TV</button>
        <button id="btnRadio" class="mode-btn" onclick="switchMode('radio')">Radio</button>
      </div>
      
      <select id="categorySelect" class="category-select" onchange="filterChannels()">
        <option value="Favoritos">⭐ Favoritos</option>
        <option value="Todos">Todos</option>
      </select>
    </div>

    <div class="grid" id="channelsGrid">
      <div class="status-msg">Cargando base de datos...</div>
    </div>
  </div>

  <script>
    let currentMode = 'tv'; 
    let dataTV = [];
    let dataRadio = [];
    let favorites = JSON.parse(localStorage.getItem('tdtFavorites')) || [];
    
    const video = document.getElementById('videoPlayer');
    let hls = null;

    function openSetup() {
      document.getElementById('setupModal').style.display = 'flex';
      document.getElementById('jsonError').style.display = 'none';
      document.getElementById('cancelBtn').style.display = (localStorage.getItem('tdtTV') || localStorage.getItem('tdtRadio')) ? 'block' : 'none';
    }

    function closeSetup() {
      document.getElementById('setupModal').style.display = 'none';
    }

    function saveJSONData() {
      const tvText = document.getElementById('jsonInputTV').value.trim();
      const radioText = document.getElementById('jsonInputRadio').value.trim();
      
      try {
        if (tvText) {
          const parsedTV = JSON.parse(tvText);
          if (!parsedTV.countries) throw new Error();
          localStorage.setItem('tdtTV', tvText);
        }
        if (radioText) {
          const parsedRadio = JSON.parse(radioText);
          if (!parsedRadio.countries) throw new Error();
          localStorage.setItem('tdtRadio', radioText);
        }
        
        closeSetup();
        document.getElementById('jsonInputTV').value = ''; 
        document.getElementById('jsonInputRadio').value = '';
        loadApp(); 
      } catch (err) {
        document.getElementById('jsonError').style.display = 'block';
      }
    }

    function loadApp() {
      const cachedTV = localStorage.getItem('tdtTV');
      const cachedRadio = localStorage.getItem('tdtRadio');
      
      if (!cachedTV && !cachedRadio) {
        openSetup();
        return;
      }

      if (cachedTV) dataTV = extractChannels(JSON.parse(cachedTV));
      if (cachedRadio) dataRadio = extractChannels(JSON.parse(cachedRadio));

      switchMode(currentMode); 
    }

    function extractChannels(data) {
      const spainData = data.countries.find(c => c.name.toLowerCase() === "españa" || c.name.toLowerCase() === "spain") || data.countries[0];
      if (!spainData || !spainData.ambits) return [];

      let parsedList = [];
      spainData.ambits.forEach(ambitObj => {
        if (ambitObj.channels) {
          ambitObj.channels.forEach(ch => {
            if (ch.options && ch.options.length > 0) {
              parsedList.push({
                name: ch.name,
                logo: ch.logo,
                url: ch.options[0].url,
                category: ambitObj.name || ambitObj.ambit 
              });
            }
          });
        }
      });
      return parsedList;
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btnTV').classList.toggle('active', mode === 'tv');
      document.getElementById('btnRadio').classList.toggle('active', mode === 'radio');
      
      const currentData = mode === 'tv' ? dataTV : dataRadio;
      
      if (currentData.length === 0) {
        document.getElementById('channelsGrid').innerHTML = `<div class="status-msg">No hay datos de ${mode.toUpperCase()}. Abre los ajustes ⚙️ para cargarlos.</div>`;
        document.getElementById('categorySelect').innerHTML = '<option value="Favoritos">⭐ Favoritos</option>';
        return;
      }

      const select = document.getElementById('categorySelect');
      const uniqueCategories = [...new Set(currentData.map(ch => ch.category))];
      
      select.innerHTML = '<option value="Favoritos">⭐ Favoritos</option><option value="Todos">Todos</option>';
      uniqueCategories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);
      });

      if (select.value !== 'Favoritos' && uniqueCategories.includes('Generalistas')) {
        select.value = 'Generalistas';
      } else {
        select.value = 'Favoritos';
      }
      
      filterChannels();
    }

    function filterChannels() {
      const select = document.getElementById('categorySelect');
      const category = select.value;
      const currentData = currentMode === 'tv' ? dataTV : dataRadio;
      let filtered = [];

      if (category === 'Favoritos') {
        filtered = currentData.filter(ch => favorites.includes(ch.name));
      } else if (category === 'Todos') {
        filtered = currentData;
      } else {
        filtered = currentData.filter(ch => ch.category === category);
      }

      renderChannels(filtered, category);
    }

    function renderChannels(channels, currentCategory) {
      const grid = document.getElementById('channelsGrid');
      grid.innerHTML = '';

      if (channels.length === 0) {
        const msg = currentCategory === 'Favoritos' 
          ? 'No tienes canales favoritos guardados.' 
          : 'No hay canales en esta categoría.';
        grid.innerHTML = `<div class="status-msg">${msg}</div>`;
        return;
      }
      
      channels.forEach(ch => {
        const isFav = favorites.includes(ch.name);
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.onclick = () => playStream(ch.url);
        
        card.innerHTML = `
          <button class="fav-btn" onclick="toggleFav('${ch.name}', event)">
            ${isFav ? '❤️' : '🤍'}
          </button>
          <img src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/70x45?text=MEDIA'">
          <span>${ch.name}</span>
        `;
        grid.appendChild(card);
      });
    }

    function toggleFav(channelName, event) {
      event.stopPropagation(); 
      
      if (favorites.includes(channelName)) {
        favorites = favorites.filter(name => name !== channelName);
      } else {
        favorites.push(channelName);
      }
      
      localStorage.setItem('tdtFavorites', JSON.stringify(favorites));
      filterChannels();
    }

    function playStream(url) {
      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(() => {});
      }
    }

    loadApp();
  </script>
</body>
</html>
