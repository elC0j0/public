<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDT Online</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #007aff;
      --text: #ffffff;
      --border: #2a2a2a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .player-container {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }
    .channel-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .channel-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }
    .channel-card img {
      max-width: 70px;
      max-height: 45px;
      object-fit: contain;
      margin-bottom: 8px;
    }
    .channel-card span {
      display: block;
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="player-container">
      <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <!-- Filtros de categoría -->
    <div class="controls" id="categoryFilters">
      <button class="filter-btn active" onclick="filterChannels('todos', this)">Todos</button>
      <button class="filter-btn" onclick="filterChannels('generalistas', this)">Generalistas</button>
      <button class="filter-btn" onclick="filterChannels('autonomicos', this)">Autonómicos</button>
      <button class="filter-btn" onclick="filterChannels('informativos', this)">Informativos</button>
      <button class="filter-btn" onclick="filterChannels('locales', this)">Locales</button>
    </div>

    <div class="grid" id="channelsGrid">
      <div class="status-msg">Cargando canales...</div>
    </div>
  </div>

  <script>
    let allChannels = [];
    const video = document.getElementById('videoPlayer');
    let hls = null;

    // Conexión mediante red de proxies CORS con tolerancia a fallos
    async function fetchJSONWithProxy(targetUrl) {
      const proxies = [
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
      ];

      for (const proxyUrl of proxies) {
        try {
          const res = await fetch(proxyUrl);
          if (res.ok) {
            return await res.json();
          }
        } catch (err) {
          console.warn(`Proxy con fallo: ${proxyUrl}`, err);
        }
      }
      throw new Error('Todos los proxies CORS rechazaron la petición.');
    }

    async function loadTDTChannels() {
      const grid = document.getElementById('channelsGrid');
      try {
        const targetUrl = 'https://www.tdtchannels.com/api/channels.json';
        const data = await fetchJSONWithProxy(targetUrl);
        
        const spainData = data.countries.find(c => c.name === "España");
        if (!spainData) throw new Error('No se encontraron canales.');

        allChannels = [];

        spainData.ambits.forEach(ambitObj => {
          const ambitType = (ambitObj.ambit || '').toLowerCase();

          ambitObj.channels.forEach(ch => {
            if (ch.options && ch.options.length > 0) {
              const nameLower = ch.name.toLowerCase();
              let category = 'generalistas';

              // Clasificación precisa según ámbito oficial
              if (ambitType === 'autonómico' || ambitType === 'autonomico') {
                category = 'autonomicos';
              } else if (ambitType === 'local') {
                category = 'locales';
              } else if (
                nameLower.includes('24h') || 
                nameLower.includes('info') || 
                nameLower.includes('euronews') || 
                nameLower.includes('324') ||
                nameLower.includes('noticias')
              ) {
                category = 'informativos';
              }

              allChannels.push({
                name: ch.name,
                logo: ch.logo,
                url: ch.options[0].url,
                category: category
              });
            }
          });
        });

        renderChannels(allChannels);
      } catch (err) {
        grid.innerHTML = `<div class="status-msg">Error al cargar los canales. (${err.message})</div>`;
        console.error(err);
      }
    }

    function renderChannels(channels) {
      const grid = document.getElementById('channelsGrid');
      grid.innerHTML = '';

      if (channels.length === 0) {
        grid.innerHTML = '<div class="status-msg">No hay canales en esta categoría.</div>';
        return;
      }
      
      channels.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.onclick = () => playStream(ch.url);
        card.innerHTML = `
          <img src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/70x45?text=TV'">
          <span>${ch.name}</span>
        `;
        grid.appendChild(card);
      });
    }

    function filterChannels(category, btnElement) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      if (category === 'todos') {
        renderChannels(allChannels);
      } else {
        const filtered = allChannels.filter(ch => ch.category === category);
        renderChannels(filtered);
      }
    }

    function playStream(url) {
      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Reproducción HLS nativa en Safari (macOS e iOS)
        video.src = url;
        video.play().catch(() => {});
      }
    }

    loadTDTChannels();
  </script>
</body>
</html>
