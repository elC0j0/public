<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDT Online</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #007aff;
      --text: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .player-container {
      max-width: 900px;
      margin: 0 auto 20px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    video {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
    }
    .controls {
      max-width: 900px;
      margin: 0 auto 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid #333;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
    .grid {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }
    .channel-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border: 1px solid #2a2a2a;
      transition: transform 0.15s;
    }
    .channel-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }
    .channel-card img {
      max-width: 60px;
      max-height: 40px;
      object-fit: contain;
      margin-bottom: 8px;
    }
    .channel-card span {
      display: block;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <video id="videoPlayer" controls autoplay playsinline></video>
  </div>

  <!-- Botones de Filtrado por Categoría -->
  <div class="controls" id="categoryFilters">
    <button class="filter-btn active" onclick="filterChannels('all')">Todos</button>
    <button class="filter-btn" onclick="filterChannels('generalistas')">Generalistas</button>
    <button class="filter-btn" onclick="filterChannels('autonomicos')">Autonómicos</button>
    <button class="filter-btn" onclick="filterChannels('informativos')">Informativos</button>
    <button class="filter-btn" onclick="filterChannels('locales')">Locales</button>
  </div>

  <!-- Contenedor de Canales -->
  <div class="grid" id="channelsGrid">Cargando canales...</div>

  <script>
    let allChannels = [];
    const video = document.getElementById('videoPlayer');
    let hls = null;

    // Cargar API oficial con soporte Safari/Chrome nativo
    async function loadTDTChannels() {
      try {
        const response = await fetch('https://www.tdtchannels.com/api/channels.json');
        if (!response.ok) throw new Error('Error en la petición');
        const data = await response.json();
        
        // Extraer canales de España y procesar categorías
        const spainData = data.countries.find(c => c.name === "España");
        allChannels = [];

        spainData.ambits.forEach(ambit => {
          ambit.channels.forEach(ch => {
            if (ch.options && ch.options.length > 0) {
              // Determinar la categoría para filtrado
              let cat = 'generalistas';
              const nameLower = ch.name.toLowerCase();
              const ambitName = ambit.ambit.toLowerCase();

              if (ambitName === 'autonómico') {
                cat = 'autonomicos';
              } else if (ambitName === 'local') {
                cat = 'locales';
              } else if (nameLower.includes('24h') || nameLower.includes('info') || nameLower.includes('euronews') || nameLower.includes('324')) {
                cat = 'informativos';
              }

              allChannels.push({
                name: ch.name,
                logo: ch.logo,
                url: ch.options[0].url,
                category: cat
              });
            }
          });
        });

        renderChannels(allChannels);
      } catch (err) {
        document.getElementById('channelsGrid').innerText = 'Error al cargar los canales. Verifica tu conexión.';
        console.error(err);
      }
    }

    function renderChannels(channels) {
      const grid = document.getElementById('channelsGrid');
      grid.innerHTML = '';
      
      channels.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.onclick = () => playStream(ch.url);
        card.innerHTML = `
          <img src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/60x40?text=TV'">
          <span>${ch.name}</span>
        `;
        grid.appendChild(card);
      });
    }

    function filterChannels(category) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (category === 'all') {
        renderChannels(allChannels);
      } else {
        const filtered = allChannels.filter(ch => ch.category === category);
        renderChannels(filtered);
      }
    }

    function playStream(url) {
      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Reproducción nativa HLS en Safari / iOS
        video.src = url;
        video.play();
      }
    }

    loadTDTChannels();
  </script>
</body>
</html>
